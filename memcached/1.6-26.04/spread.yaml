project: memcached

backends:
  craft:
    type: craft
    systems:
      - ubuntu-24.04:
      #- ubuntu-22.04:

suites:
  spread/general/:
    summary: General integration tests

    prepare: |
      sudo snap install docker

      # For 'rockcraft.skopeo'
      sudo snap install --classic rockcraft

      # Wait for docker daemon to come online
      sudo apt install --yes retry
      retry --times=10 --delay 2 -- docker images
      sudo apt remove --yes retry

      # Load the rock into docker
      sudo rockcraft.skopeo --insecure-policy copy "oci-archive:$CRAFT_ARTIFACT" docker-daemon:memcached:1.6-26.04

    restore: |
      docker image rm --force memcached:1.6-26.04

  spread/k8s/:
    summary: K8s integration tests

    prepare: |
      sudo snap remove docker
      sudo snap install rockcraft --classic

      # on s390x and ppc64le we need to install k8s from the edge channel
      CHANNEL="stable"
      if [ "$(uname -m)" = "s390x" ] || [ "$(uname -m)" = "ppc64le" ]; then
        CHANNEL="latest/edge"
      fi
      sudo snap install k8s --classic --channel=$CHANNEL

      # Cleanup containerd
      sudo rm -rf /run/containerd
      sudo rm -rf /var/run/containerd

      # Bootstrap k8s and wait for it to be ready
      k8s bootstrap || {
          echo "=== k8sd logs ==="
          journalctl -u k8sd --no-pager -n 500 || true

          echo "=== k8sd service status ==="
          systemctl status k8sd || true

          echo "=== kubectl pods ==="
          kubectl get pods -A || true

          echo "=== cluster status ==="
          k8s status || true

          exit 1
      }
      k8s status --wait-ready

      # Copy the built image to the local registry
      /snap/k8s/current/bin/ctr --address /run/containerd/containerd.sock -n k8s.io \
        images import --base-name docker.io/library/memcached $CRAFT_ARTIFACT

exclude:
  - .git

kill-timeout: 1h
